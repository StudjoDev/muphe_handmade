      let currentLookupMode = "bracelet";

      const fieldKeys = {

        crystals: ["crystals", "crystalList", "crystal_list", "stones", "晶種", "水晶清單", "水晶列表"],
        energyFocus: ["energyFocus", "energy_focus", "能量主題", "能量焦點"],
        chakraFocus: ["chakraFocus", "chakra_focus", "脈輪主題", "脈輪焦點"],

        wearingGuide: ["wearingGuide", "wearing", "wearGuide", "wearing_guide", "配戴指南", "佩戴指南"],
        careGuide: ["careInstructions", "careGuide", "care", "care_guide", "保養說明", "保養指南", "照顧方式"],
        ritual: ["ritual", "dailyRitual", "ritualGuide", "儀式", "日常儀式"],
        makerNote: ["makerNote", "maker_note", "artistNote", "製作者備註", "店主小語"],
        photo: ["photo", "photoUrl", "photo_url", "image", "imageUrl", "image_url", "照片"],
        contactUrl: ["contactUrl", "contact_url", "lineUrl", "supportUrl", "聯繫連結"],
        orderUrl: ["productUrl", "product_url", "orderUrl", "order_url", "shopUrl", "reorderUrl", "商品或公開頁網址", "訂購連結"],
      };

      const crystalFunctionDescriptions = {

        月光石: "安撫情緒起伏，支援柔軟、睡眠與內在安全感。",
        橙月光石: "讓情緒與人際流動回到溫暖節奏，適合敏感、需要被接住的狀態。",
        太陽石: "補充亮度、勇氣與舞台感，讓行動更有熱度。",
        金太陽石: "推動執行魄力與財運亮度，適合需要發光與衝刺的階段。",
        黃水晶: "聚焦財氣、自信與行動力，適合事業推進與資源累積。",
        金髮晶: "提升財運磁場與決策膽識，適合需要衝業績與被看見的時刻。",

        綠髮晶: "支援正財與事業拓展，適合想累積成果與提高行動續航。",
        海藍寶: "讓表達更溫和清楚，也能替焦躁情緒降溫。",
        天河石: "平衡理性表達與情緒壓力，適合需要說清楚又保持柔和的場景。",
        青金石: "支援洞察、判斷與清楚表達，適合決策、考試與簡報。",
        螢石: "整理混亂資訊與專注力，適合腦袋打結、需要清楚排序時。",
        黑曜石: "建立界線與防護，排除不必要消耗與外界干擾。",
        黑髮晶: "強化防護、穩定與抗干擾力，適合職場界線與外界雜訊。",
        黑鈦晶: "同時具備防護與財氣推進感，適合高壓環境下守住氣場。",
        茶晶: "讓能量落地、穩住節奏，適合疲憊、防護與守財。",
        拉長石: "守護敏感能量與直覺，適合需要防護、轉化與內在洞察時。",
        藍砂石: "穩定思緒與夜間能量，適合想安定、收束注意力的時候。",
        藍碧璽: "支援深度溝通、直覺與精細思考，適合高預算的精緻配置。",
        舒俱徠石: "照顧深層療癒與高頻安定，適合需要強力心靈支持的高預算配置。",
      };

      const crystalFunctionAliases = {
        粉晶: "粉水晶",
        白晶: "白水晶",
        黑碧璽: "黑曜石",
      };

      function normalizeString(value) {
        if (value === null || value === undefined) return "";
        if (Array.isArray(value)) return value.map(normalizeString).filter(Boolean).join("、");
        if (typeof value === "object") return "";
        return String(value).trim();
      }

      function escapeHtml(value) {
        return normalizeString(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function pick(source, keys) {
        if (!source || typeof source !== "object") return "";

        for (const key of keys) {
          const value = source[key];
          const hasStructuredValue =
            Array.isArray(value) ? value.length > 0 : value && typeof value === "object" && Object.keys(value).length > 0;
          if (hasStructuredValue || (value !== null && value !== undefined && normalizeString(value))) {
            return value;
          }
        }

        return "";
      }

      function getEndpointUrl(query, extraParams = {}) {
        if (!WEB_APP_URL || WEB_APP_URL === WEB_APP_URL_PLACEHOLDER) {
          return "";
        }

        const action = query.action || lookupModeCopy[currentLookupMode].action;
        const endpoint = new URL(WEB_APP_URL, window.location.href);
        endpoint.searchParams.set("type", action);
        endpoint.searchParams.set("action", action);
        endpoint.searchParams.set("source", "bracelet-page");

        if (query.code) endpoint.searchParams.set("code", query.code);
        if (query.token) endpoint.searchParams.set("token", query.token);
        if (query.name) endpoint.searchParams.set("name", query.name);
        if (query.birthDate) endpoint.searchParams.set("birthDate", query.birthDate);

        Object.entries(extraParams).forEach(([key, value]) => {
          endpoint.searchParams.set(key, value);
        });

        return endpoint.toString();
      }

      function normalizeHref(value) {
        const text = normalizeString(value);
        if (!text) return "";

        try {
          const url = new URL(text, window.location.href);
          const allowedProtocols = ["http:", "https:", "mailto:", "tel:"];
          if (allowedProtocols.includes(url.protocol)) {
            return url.href;
          }
        } catch (error) {
          return "";
        }

        return "";
      }

      function showStatus(kind, title, message) {
        const isLoading = kind === "loading";
        statusRegion.hidden = false;
        statusRegion.dataset.state = kind;
        statusRegion.setAttribute("role", kind === "error" ? "alert" : "status");
        statusRegion.innerHTML = `
          <div class="bracelet-status-content">
            <span class="${isLoading ? "bracelet-spinner" : "bracelet-status-dot"}" aria-hidden="true"></span>
            <div>
              <strong>${escapeHtml(title)}</strong>
              <p>${escapeHtml(message)}</p>
            </div>
          </div>
        `;
      }

      function showForgotStatus(kind, title, message, accessCode = "") {
        if (!forgotStatus) return;

        forgotStatus.hidden = false;
        forgotStatus.dataset.state = kind;
        forgotStatus.setAttribute("role", kind === "error" ? "alert" : "status");

        if (accessCode) {
          forgotStatus.innerHTML = `
            <div class="forgot-code-found">
              <div>
                <strong>${escapeHtml(title)}</strong>
                <p>${escapeHtml(message)}</p>
              </div>
              <div class="forgot-code-copy">
                <code data-forgot-code-value>${escapeHtml(accessCode)}</code>
                <button class="secondary-link" type="button" data-copy-forgot-code>複製</button>
              </div>
            </div>
          `;
          return;
        }

        forgotStatus.innerHTML = `
          <div class="forgot-code-message">
            <strong>${escapeHtml(title)}</strong>
            <p>${escapeHtml(message)}</p>
          </div>
        `;
      }

      function hideForgotStatus() {
        if (!forgotStatus) return;
        forgotStatus.hidden = true;
        forgotStatus.innerHTML = "";
        delete forgotStatus.dataset.state;
      }

      function hideProfile() {
        profileSection.hidden = true;
        profileContent.innerHTML = "";
      }

      function getLookupCopy(mode = currentLookupMode) {
        return lookupModeCopy[mode] || lookupModeCopy.bracelet;
      }

      function setLookupMode(mode, options = {}) {
        const normalizedMode = "bracelet";
        currentLookupMode = normalizedMode;
        const copy = getLookupCopy();

        if (codeLabel) codeLabel.textContent = copy.label;
        if (codeHelp) codeHelp.textContent = copy.help;
        lookupModeButtons.forEach((button) => {
          const isActive = button.dataset.lookupMode === normalizedMode;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });

        const showForgot = false;
        if (forgotToggle) forgotToggle.hidden = !showForgot;
        if (forgotPanel && !showForgot) {
          forgotPanel.hidden = true;
          if (forgotToggle) forgotToggle.setAttribute("aria-expanded", "false");
          hideForgotStatus();
        }

        if (options.updateUrl !== false) {
          const nextUrl = new URL(window.location.href);
          nextUrl.searchParams.delete("type");
          window.history.replaceState({}, "", nextUrl);
        }

        if (options.refreshIdle !== false && profileSection.hidden) {
          showIdle();
        }
      }

      function showIdle() {
        hideProfile();
        const copy = getLookupCopy();
        showStatus("idle", copy.idleTitle, copy.idleMessage);
      }

      function parseTextList(value) {
        if (!value) return [];
        if (Array.isArray(value)) {
          return value.map(normalizeString).filter(Boolean);
        }

        const text = normalizeString(value);
        if (!text) return [];

        return text
          .split(/\n|；|;/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function parseCrystalString(value) {
        const text = normalizeString(value);
        if (!text) return null;
        const match = text.match(/^(.+?)(?:[:：]| - |－)(.+)$/);

        if (match) {
          return {
            name: match[1].trim(),
            meaning: match[2].trim(),
          };
        }

        return { name: text, meaning: "" };
      }

      function normalizeCrystals(value) {
        if (!value) return [];

        if (Array.isArray(value)) {
          return value
            .map((item) => {
              if (typeof item === "object" && item) {
                return {
                  name: normalizeString(pick(item, ["name", "crystal", "stone", "晶種", "名稱"])),
                  meaning: normalizeString(pick(item, ["meaning", "effect", "note", "intention", "含義", "意義", "功效"])),
                };
              }

              return parseCrystalString(item);
            })
            .filter((item) => item && item.name);
        }

        if (typeof value === "object") {
          return Object.entries(value)
            .map(([name, meaning]) => ({
              name: normalizeString(name),
              meaning: normalizeString(meaning),
            }))
            .filter((item) => item.name);
        }

        const text = normalizeString(value);
        const delimiter = /[\n；;]/.test(text) ? /\n|；|;/ : /、|,/;

        return text
          .split(delimiter)
          .map(parseCrystalString)
          .filter((item) => item && item.name);
      }

      function findProfileSource(payload) {
        const candidates = [
          payload && payload.profile,
          payload && payload.braceletProfile,
          payload && payload.publicProfile,
          payload && payload.bracelet,
          payload && payload.data && payload.data.profile,
          payload && payload.data && payload.data.bracelet,
          payload && payload.data,
          payload && payload.result && payload.result.profile,
          payload && payload.result,
          payload && payload.record,
          payload,
        ];

        return candidates.find((candidate) => {
          if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return false;
          return Object.values(fieldKeys).some((keys) =>
            keys.some((key) => candidate[key] !== null && candidate[key] !== undefined),
          );
        });
      }

      function normalizeProfile(payload) {
        if (!payload || typeof payload !== "object") {
          throw new Error("回傳格式不是有效的手鍊檔案。");
        }

        if (payload.success === false || payload.ok === false || payload.status === "error") {
          throw new Error(
            normalizeString(payload.error && payload.error.message) ||
              normalizeString(payload.message) ||
              "目前查不到這組查詢資料。",
          );
        }

        const source = findProfileSource(payload);
        if (!source) {
          throw new Error("目前查不到這組查詢資料。");
        }

        const profile = {
          profileType: normalizeString(pick(source, fieldKeys.profileType)),
          name: normalizeString(pick(source, fieldKeys.name)),
          scene: normalizeString(pick(source, fieldKeys.scene)),
          displayName: normalizeString(pick(source, fieldKeys.displayName)),
          intention: normalizeString(pick(source, fieldKeys.intention)),
          crystals: normalizeCrystals(pick(source, fieldKeys.crystals)),
          energyFocus: parseTextList(pick(source, fieldKeys.energyFocus)),
          chakraFocus: parseTextList(pick(source, fieldKeys.chakraFocus)),
          designNotes: parseTextList(pick(source, fieldKeys.designNotes)),
          wearingGuide: parseTextList(pick(source, fieldKeys.wearingGuide)),
          careGuide: parseTextList(pick(source, fieldKeys.careGuide)),
          ritual: parseTextList(pick(source, fieldKeys.ritual)),
          makerNote: parseTextList(pick(source, fieldKeys.makerNote)),
          photo: normalizeHref(pick(source, fieldKeys.photo)),
          contactUrl: normalizeHref(pick(source, fieldKeys.contactUrl)) || "mailto:muphe.handmade@gmail.com?subject=MUPHE%20水晶手鍊客製諮詢",
          orderUrl: normalizeHref(pick(source, fieldKeys.orderUrl)) || "index.html#shop",
        };

        const hasPublicContent =
          profile.name ||
          profile.scene ||
          profile.displayName ||
          profile.intention ||
          profile.crystals.length ||
          profile.energyFocus.length ||
          profile.chakraFocus.length ||
          profile.designNotes.length ||
          profile.wearingGuide.length ||
          profile.careGuide.length ||
          profile.ritual.length ||
          profile.makerNote.length;

        if (!hasPublicContent) {
          throw new Error("這份檔案尚未開放公開內容。");
        }

        return profile;
      }

      function isLookupNotFoundPayload(payload) {
        return Boolean(
          payload &&
            (payload.success === false || payload.ok === false || payload.status === "error") &&
            normalizeString(payload.error && payload.error.code) === "not_found",
        );
      }

      async function requestApi(query) {
        const endpoint = getEndpointUrl(query);

        if (!endpoint) {
          throw new Error("查詢網址尚未設定，請先更新 Google Apps Script Web App URL。");
        }

        try {
          const response = await fetch(endpoint, {
            method: "GET",
            cache: "no-store",
            redirect: "follow",
          });
          const text = await response.text();

          if (!response.ok) {
            throw new Error("查詢服務暫時無法回應。");
          }

          try {
            return JSON.parse(text);
          } catch (error) {
            throw new Error("查詢服務尚未回傳可讀取資料。");
          }
        } catch (error) {
          return requestProfileJsonp(query, error);
        }
      }

      function requestProfile(query, mode = currentLookupMode) {
        return requestApi({ ...query, action: getLookupCopy(mode).action });
      }

      function requestForgotCode(name, birthDate) {
        return requestApi({
          action: FORGOT_CODE_ACTION,
          name,
          birthDate,
        });
      }

      function requestProfileJsonp(query, originalError) {
        return new Promise((resolve, reject) => {
          const callbackName = `mupheBraceletProfile${Date.now()}${Math.floor(Math.random() * 1000)}`;
          const endpoint = getEndpointUrl(query, { callback: callbackName });

          if (!endpoint) {
            reject(originalError);
            return;
          }

          const script = document.createElement("script");
          const timeout = window.setTimeout(() => {
            cleanup();
            reject(originalError);
          }, 9000);

          function cleanup() {
            window.clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = (payload) => {
            cleanup();
            resolve(payload);
          };

          script.onerror = () => {
            cleanup();
            reject(originalError);
          };
          script.src = endpoint;
          document.body.append(script);
        });
      }

      function getCustomerErrorMessage(error) {
        const message = normalizeString(error && error.message);
        const networkFailures = ["Failed to fetch", "Load failed", "NetworkError"];

        if (!message || networkFailures.some((failure) => message.includes(failure))) {
          return "目前無法連線到查詢服務，請稍後再試或聯繫店主。";
        }

        return message;
      }

      function normalizeAccessCodeForDisplay(payload) {
        const code = normalizeString(
          payload &&
            (payload.accessCode ||
              payload.code ||
              (payload.data && (payload.data.accessCode || payload.data.code)) ||
              (payload.result && (payload.result.accessCode || payload.result.code))),
        );
        return code.toUpperCase();
      }

      async function copyTextWithFallback(text, sourceElement) {
        if (!text) return false;

        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          if (!sourceElement) return false;
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(sourceElement);
          selection.removeAllRanges();
          selection.addRange(range);

          try {
            return document.execCommand("copy");
          } catch (copyError) {
            return false;
          }
        }
      }

      function renderList(items) {
        if (!items.length) return `<p class="profile-muted">尚未提供。</p>`;

        return `
          <ul class="profile-note-list">
            ${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        `;
      }

      function renderCrystals(crystals) {
        if (!crystals.length) return `<p class="profile-muted">尚未提供。</p>`;

        return `
          <div class="profile-crystal-list">
            ${crystals
              .map(
                (crystal) => `
                  <article>
                    <strong>${escapeHtml(crystal.name)}</strong>
                    ${crystal.meaning ? `<p>${escapeHtml(crystal.meaning)}</p>` : ""}
                  </article>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderProfile(profile) {
        renderConsultationCard(profile);
      }

      function isConsultationCard(profile) {
        const marker = [
          profile.profileType,
          profile.scene,
          profile.name,
        ].join(" ");
        return /analysisEvaluation|consultationCard|水晶諮詢(?:圖卡|分析表)|水晶狀態(?:圖卡|分析表)/.test(marker);
      }

      function isFullAnalysisText(text) {
        if (!text) return false;
        return text.length > 200 ||
               /您的專屬水晶能量初步評估|多維度.*能量.*評估|設計報告|暖心陪伴語|配戴與消磁儀式建議|【手[鍊鏈]\s*[ABC]/.test(normalizeString(text));
      }

      function normalizeInlineAnalysisText(text) {
        return normalizeString(text)
          .replace(/\s+/g, " ")
          .replace(/([\u3400-\u9fff])\s+([\u3400-\u9fff])/g, "$1$2")
          .replace(/\s+([，。、！？；：）】])/g, "$1")
          .replace(/([（【])\s+/g, "$1")
          .trim();
      }

      function prepareAnalysisReportText(text) {
        return normalizeString(text)
          .replace(/（本地規則\s*Fallback\s*生成）/g, "")
          .replace(/\(本地規則\s*Fallback\s*生成\)/g, "")
          .replace(/\s+(?=(?:🔮|📿|🧘|💬)\s*【)/g, "\n")
          .replace(/\s+(?=【(?:基本資料|狀態優先|分析模組|計算式|設計公式|色系調和|狀態判讀|水晶搭配|評分摘要|能量解說)】)/g, "\n")
          .replace(/\s+-\s+/g, "\n- ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function isAnalysisSectionHeader(line) {
        return /^(?:🔮|📿|🧘|💬)\s*【[^】]+】/.test(line);
      }

      function createAnalysisSection(title) {
        return {
          title,
          fields: [],
        };
      }

      function addAnalysisParagraph(section, text) {
        const body = normalizeInlineAnalysisText(text);
        if (!body) return;

        const last = section.fields[section.fields.length - 1];
        if (section.title.includes("暖心陪伴語") && last && last.type === "paragraph") {
          last.body = normalizeInlineAnalysisText(last.body + body);
          return;
        }

        section.fields.push({ type: "paragraph", body });
      }

      function parseAnalysisReport(text) {
        const report = prepareAnalysisReportText(text);
        const lines = report.split(/\n+/).map((line) => line.trim()).filter(Boolean);
        const sections = [];
        let currentSection = createAnalysisSection("");

        lines.forEach((line) => {
          const headerMatch = line.match(/^((?:🔮|📿|🧘|💬)\s*【[^】]+】)\s*(.*)$/);
          if (headerMatch) {
            if (currentSection.title || currentSection.fields.length) {
              sections.push(currentSection);
            }
            currentSection = createAnalysisSection(headerMatch[1]);
            if (headerMatch[2]) {
              addAnalysisParagraph(currentSection, headerMatch[2]);
            }
            return;
          }

          const fieldMatch = line.match(/^【([^】]+)】：?\s*(.*)$/);
          if (fieldMatch) {
            currentSection.fields.push({
              type: "field",
              label: fieldMatch[1],
              body: normalizeInlineAnalysisText(fieldMatch[2]),
            });
            return;
          }

          if (line.startsWith("-")) {
            currentSection.fields.push({
              type: "bullet",
              body: normalizeInlineAnalysisText(line.replace(/^-\s*/, "")),
            });
            return;
          }

          addAnalysisParagraph(currentSection, line);
        });

        if (currentSection.title || currentSection.fields.length) {
          sections.push(currentSection);
        }

        return sections;
      }

      function normalizeCrystalFunctionName(name) {
        const cleaned = normalizeString(name).replace(/[（(].*?[）)]/g, "").trim();
        return crystalFunctionAliases[cleaned] || cleaned;
      }

      function parseAnalysisCrystalNames(text) {
        const seen = new Set();
        return normalizeString(text)
          .split(/\s*(?:、|，|,|\+|與|配搭|和)\s*/)
          .map(normalizeCrystalFunctionName)
          .filter((name) => {
            if (!name || seen.has(name)) return false;
            seen.add(name);
            return true;
          });
      }

      function buildCrystalFunctionItems(crystalNames) {
        return crystalNames.map((name) => ({
          name,
          description: crystalFunctionDescriptions[name] || "作為整體能量配置的補充晶種，協助完成這款手鍊的能量分工。",
        }));
      }

      function parseEnergyExplanationItems(text) {
        return normalizeString(text)
          .split(/；|;/)
          .map((item) => item.trim())
          .filter(Boolean)
          .map((item) => {
            const match = item.match(/^([^：:]{1,16})[:：]\s*(.+)$/);
            return match
              ? {
                  name: normalizeCrystalFunctionName(match[1]),
                  description: normalizeInlineAnalysisText(match[2]),
                }
              : {
                  name: "",
                  description: normalizeInlineAnalysisText(item),
                };
          });
      }

      function shouldUseCrystalFunctionExplanation(body, crystalNames) {
        if (!crystalNames.length) return false;
        const normalizedBody = normalizeString(body);
        const mentionedCount = crystalNames.filter((name) => normalizedBody.includes(name)).length;
        return mentionedCount < Math.min(2, crystalNames.length) || /系統會|水晶資料庫|加權|主軸|提高|狀態描述|星座|生肖/.test(normalizedBody);
      }

      function enrichAnalysisSectionsWithCrystalFunctions(sections) {
        return sections.map((section) => {
          const crystalField = section.fields.find((field) => field.type === "field" && field.label === "水晶搭配");
          const crystalNames = crystalField ? parseAnalysisCrystalNames(crystalField.body) : [];
          if (!crystalNames.length) return section;

          return {
            ...section,
            fields: section.fields.map((field) => {
              if (field.type !== "field" || field.label !== "能量解說") return field;
              if (!shouldUseCrystalFunctionExplanation(field.body, crystalNames)) {
                return {
                  ...field,
                  items: parseEnergyExplanationItems(field.body),
                };
              }
              return {
                ...field,
                body: buildCrystalFunctionItems(crystalNames)
                  .map((item) => `${item.name}：${item.description}`)
                  .join("；"),
                items: buildCrystalFunctionItems(crystalNames),
              };
            }),
          };
        });
      }

      function renderEnergyExplanationItems(items) {
        return `
          <ul class="analysis-summary-list analysis-energy-list">
            ${items
              .filter((item) => item && (item.name || item.description))
              .map((item) => `
                <li>
                  ${item.name ? `<strong>${escapeHtml(item.name)}</strong>` : ""}
                  <span>${escapeHtml(item.description)}</span>
                </li>
              `)
              .join("")}
          </ul>
        `;
      }

      function renderAnalysisField(field) {
        if (field.type === "bullet") {
          return `<li>${escapeHtml(field.body)}</li>`;
        }

        if (field.type === "field") {
          const body = field.label === "水晶搭配"
            ? `<div class="analysis-chip-row">${normalizeString(field.body)
                .split(/[、，,]+/)
                .map((item) => item.trim())
                .filter(Boolean)
                .map((item) => `<span>${escapeHtml(item)}</span>`)
                .join("")}</div>`
            : field.label === "評分摘要"
              ? `<ul class="analysis-summary-list">${normalizeString(field.body)
                  .split(/；|;/)
                  .map((item) => item.trim())
                  .filter(Boolean)
                  .map((item) => `<li>${escapeHtml(item)}</li>`)
                  .join("")}</ul>`
            : field.label === "能量解說"
              ? renderEnergyExplanationItems(field.items || parseEnergyExplanationItems(field.body))
            : `<p>${escapeHtml(field.body)}</p>`;

          return `
            <div class="analysis-field">
              <strong>${escapeHtml(field.label)}</strong>
              ${body}
            </div>
          `;
        }

        return `<p class="analysis-paragraph">${escapeHtml(field.body)}</p>`;
      }

      function renderAnalysisReport(text) {
        const sections = enrichAnalysisSectionsWithCrystalFunctions(parseAnalysisReport(text))
          .filter((section) => {
            const title = section.title || "";
            return !title.includes("暖心陪伴語") &&
                   !title.includes("配戴") &&
                   !title.includes("日常提醒") &&
                   !title.includes("保養") &&
                   !title.includes("淨化") &&
                   !title.includes("儀式");
          });
        if (!sections.length) return "";

        return `
          <div class="analysis-report">
            ${sections
              .map((section) => {
                const bulletItems = section.fields.filter((field) => field.type === "bullet");
                const nonBulletItems = section.fields.filter((field) => field.type !== "bullet");
                return `
                  <section class="analysis-report-section">
                    ${section.title ? `<h4>${escapeHtml(section.title)}</h4>` : ""}
                    ${nonBulletItems.map(renderAnalysisField).join("")}
                    ${bulletItems.length ? `<ul class="analysis-bullet-list">${bulletItems.map(renderAnalysisField).join("")}</ul>` : ""}
                  </section>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function renderConsultationCard(profile) {
        const focusItems = [...profile.energyFocus, ...profile.chakraFocus];
        const analysisText = isFullAnalysisText(profile.intention) ? profile.intention : "";
        const hasFullAnalysis = !!analysisText;

        profileContent.innerHTML = `
          <article class="consultation-card-shell" aria-label="個人水晶分析表">
            <div class="consultation-card-brand">
              <img src="pic/muphe_logo.webp" alt="" />
              <span>MUPHÉ Handmade 沐菲手作水晶</span>
            </div>
            <div class="consultation-card-head">
              ${profile.scene ? `<p class="eyebrow">${escapeHtml(profile.scene)}</p>` : ""}
              <h2 id="profile-heading" tabindex="-1">${escapeHtml(profile.name || "你的水晶狀態分析表")}</h2>
              ${profile.displayName ? `<p class="profile-for">為 ${escapeHtml(profile.displayName)} 整理的個人分析表</p>` : ""}
              ${!hasFullAnalysis && profile.intention ? `<p>${escapeHtml(profile.intention)}</p>` : ""}
            </div>

            ${
              hasFullAnalysis
                ? `
                  <section class="consultation-card-panel consultation-analysis-panel" aria-labelledby="consultation-analysis-title">
                    <h3 id="consultation-analysis-title">您的專屬水晶能量初步評估</h3>
                    ${renderAnalysisReport(analysisText)}
                  </section>
                `
                : ""
            }

            ${
              !hasFullAnalysis && focusItems.length
                ? `
                  <section class="consultation-card-panel" aria-labelledby="consultation-focus-title">
                    <h3 id="consultation-focus-title">目前最需要照顧的狀態</h3>
                    <div class="consultation-tag-row">
                      ${focusItems.map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
                    </div>
                  </section>
                `
                : ""
            }

            ${
              !hasFullAnalysis
                ? `
                  <section class="consultation-card-panel" aria-labelledby="consultation-crystals-title">
                    <h3 id="consultation-crystals-title">沐菲初步推薦方向</h3>
                    ${renderCrystals(profile.crystals)}
                  </section>
                `
                : ""
            }

            ${
              !hasFullAnalysis && profile.designNotes.length
                ? `
                  <section class="consultation-card-panel" aria-labelledby="consultation-calculation-title">
                    <h3 id="consultation-calculation-title">計算方式</h3>
                    ${renderList(profile.designNotes)}
                  </section>
                `
                : ""
            }


            ${
              profile.makerNote.length
                ? `
                  <footer class="consultation-card-note">
                    <h3>沐菲貼心語</h3>
                    ${renderList(profile.makerNote)}
                  </footer>
                `
                : ""
            }
          </article>
        `;

        profileSection.hidden = false;
        statusRegion.hidden = true;
        document.title = `${profile.name || "水晶分析表"}｜沐菲 MUPHÉ Handmade`;
        document.getElementById("profile-heading").focus({ preventScroll: true });
        profileSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function lookupProfile(query, options = {}) {
        const normalizedQuery = {
          code: normalizeString(query.code).toUpperCase(),
          token: normalizeString(query.token),
        };
        const requestedMode = normalizedQuery.token || query.mode === "bracelet" ? "bracelet" : currentLookupMode;
        const copy = getLookupCopy(requestedMode);

        if (!normalizedQuery.code && !normalizedQuery.token) {
          showIdle();
          codeInput.focus();
          return;
        }

        hideProfile();
        showStatus("loading", copy.loadingTitle, copy.loadingMessage);

        try {
          let activeMode = requestedMode;
          let payload = await requestProfile(normalizedQuery, activeMode);

          if (isLookupNotFoundPayload(payload) && activeMode === "analysis" && options.allowBraceletFallback !== false) {
            const fallbackPayload = await requestProfile(normalizedQuery, "bracelet");
            if (!isLookupNotFoundPayload(fallbackPayload)) {
              payload = fallbackPayload;
              activeMode = "bracelet";
              setLookupMode("bracelet", { updateUrl: false, refreshIdle: false });
              const nextUrl = new URL(window.location.href);
              nextUrl.searchParams.set("type", "bracelet");
              window.history.replaceState({}, "", nextUrl);
            }
          }

          const profile = normalizeProfile(payload);
          renderProfile(profile);
        } catch (error) {
          showStatus(
            "error",
            "查詢失敗",
            getCustomerErrorMessage(error),
          );
          hideProfile();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const code = normalizeString(codeInput.value).toUpperCase();
        const copy = getLookupCopy();

        if (!code) {
          showStatus("error", copy.emptyTitle, copy.emptyMessage);
          codeInput.focus();
          return;
        }

        codeInput.value = code;
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("code", code);
        nextUrl.searchParams.delete("type");
        nextUrl.searchParams.delete("token");
        window.history.replaceState({}, "", nextUrl);
        lookupProfile({ code, mode: "bracelet" }, { allowBraceletFallback: false });
      });

      lookupModeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const nextMode = button.dataset.lookupMode === "bracelet" ? "bracelet" : "analysis";
          if (nextMode === currentLookupMode) return;
          setLookupMode(nextMode);
        });
      });

      if (forgotToggle && forgotPanel) {
        forgotToggle.addEventListener("click", () => {
          const willOpen = forgotPanel.hidden;
          forgotPanel.hidden = !willOpen;
          forgotToggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
          if (willOpen) {
            window.setTimeout(() => forgotNameInput && forgotNameInput.focus(), 80);
          } else {
            hideForgotStatus();
          }
        });
      }

      if (forgotForm) {
        forgotForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = normalizeString(forgotNameInput && forgotNameInput.value);
          const birthDate = normalizeString(forgotBirthDateInput && forgotBirthDateInput.value);

          if (!name || !birthDate) {
            showForgotStatus("error", "請填寫姓名與生日", "需要兩個欄位都正確，才能找回諮詢表密碼。");
            if (!name && forgotNameInput) forgotNameInput.focus();
            else if (forgotBirthDateInput) forgotBirthDateInput.focus();
            return;
          }

          showForgotStatus("loading", "正在確認資料", "請稍候，系統正在比對姓名與生日。");

          try {
            const payload = await requestForgotCode(name, birthDate);
            if (!payload || payload.success === false || payload.ok === false || payload.status === "error") {
              throw new Error(
                normalizeString(payload && payload.error && payload.error.message) ||
                  normalizeString(payload && payload.message) ||
                  "找不到符合的諮詢表密碼。",
              );
            }

            const accessCode = normalizeAccessCodeForDisplay(payload);
            if (!accessCode) {
              throw new Error("找不到符合的諮詢表密碼。");
            }

            codeInput.value = accessCode;
            setLookupMode("analysis", { refreshIdle: false });
            showForgotStatus("success", "已找到諮詢表密碼", "已自動帶入上方查詢欄，也可以先複製保存。", accessCode);
          } catch (error) {
            showForgotStatus("error", "找回失敗", getCustomerErrorMessage(error));
          }
        });

        forgotForm.addEventListener("input", () => {
          if (forgotStatus && forgotStatus.dataset.state === "error") {
            hideForgotStatus();
          }
        });
      }

      if (forgotStatus) {
        forgotStatus.addEventListener("click", async (event) => {
          const copyButton = event.target.closest("[data-copy-forgot-code]");
          if (!copyButton) return;

          const codeElement = forgotStatus.querySelector("[data-forgot-code-value]");
          const accessCode = normalizeString(codeElement && codeElement.textContent);
          const copied = await copyTextWithFallback(accessCode, codeElement);
          copyButton.textContent = copied ? "已複製" : "已選取";
          window.setTimeout(() => {
            copyButton.textContent = "複製";
          }, 1600);
        });
      }

      if (menuToggle && mobileNav) {
        menuToggle.addEventListener("click", () => {
          mobileNav.classList.toggle("is-open");
        });
        mobileNav.addEventListener("click", (event) => {
          if (event.target.closest("a")) {
            mobileNav.classList.remove("is-open");
          }
        });
      }

      const urlParams = new URLSearchParams(window.location.search);
      const initialCode = normalizeString(urlParams.get("code")).toUpperCase();
      const initialToken = normalizeString(urlParams.get("token"));
      const requestedType = normalizeString(urlParams.get("type") || urlParams.get("mode")).toLowerCase();

      if (requestedType === "analysis") {
        const redirectUrl = new URL("consultation.html", window.location.href);
        if (initialCode) redirectUrl.searchParams.set("code", initialCode);
        window.location.replace(redirectUrl.toString());
        return;
      }

      const initialMode = "bracelet";

      setLookupMode(initialMode, { updateUrl: false, refreshIdle: false });

      if (initialCode) {
        codeInput.value = initialCode;
      }

      if (initialCode || initialToken) {
        lookupProfile({ code: initialCode, token: initialToken, mode: initialMode }, { allowBraceletFallback: false });
      } else {
        showIdle();
      }
    })();
  </script>
</body>
